# Local-only deployment template. Run scripts/configure_local.py to create
# config/profiles/local.yaml with validated model and executable paths.
# Placeholder values are replaced as YAML data, never by raw text substitution.
version: 1

providers:
  gemma_router:
    id: provider.gemma_router
    name: Gemma Router
    type: openai_compatible
    kind: local
    base_url: http://127.0.0.1:8090/v1
    alias: gemma-router
    health_endpoint: http://127.0.0.1:8090/health
    gateway_alias: gemma-router

  gpt_oss:
    id: provider.gpt_oss
    name: GPT-OSS llama.cpp
    type: openai_compatible
    kind: local
    base_url: http://127.0.0.1:8080/v1
    alias: gpt-oss
    health_endpoint: http://127.0.0.1:8080/health
    gateway_alias: gpt-oss

  litellm_gateway:
    id: provider.litellm_gateway
    name: LiteLLM Gateway
    type: litellm_gateway
    kind: local
    base_url: http://127.0.0.1:4000/v1
    api_key: ${ORATRICE_LITELLM_MASTER_KEY}
    alias: litellm
    health_endpoint: http://127.0.0.1:4000/health/liveliness
    gateway_alias: litellm
    model_aliases:
      gpt_oss: gpt_oss

  core_api:
    id: provider.core_api
    name: Oratrice Core API
    type: oratrice_core_api
    kind: local
    base_url: http://127.0.0.1:8000
    alias: core-api
    health_endpoint: http://127.0.0.1:8000/live

runtimes:
  gemma_router:
    id: runtime.gemma_router
    name: Gemma Router llama.cpp
    type: executable
    executable: '@LLAMA_SERVER@'
    working_dir: '@PROJECT_ROOT@'
    provider: provider.gemma_router
    args:
      - --model
      - '@ROUTER_MODEL@'
      - --host
      - 127.0.0.1
      - --port
      - '8090'
      - --alias
      - gemma-router
      - --gpu-layers
      - '0'
      - --flash-attn
      - 'on'
      - -t
      - '@THREADS@'
      - --ctx-size
      - '@CTX_SIZE@'
      - --parallel
      - '1'
      - --cache-ram
      - '@PROMPT_CACHE_MIB@'

  gpt_oss:
    id: runtime.gpt_oss
    name: GPT-OSS llama.cpp
    type: executable
    executable: '@LLAMA_SERVER@'
    working_dir: '@PROJECT_ROOT@'
    provider: provider.gpt_oss
    args:
      - --model
      - '@GPT_MODEL@'
      - --host
      - 127.0.0.1
      - --port
      - '8080'
      - --alias
      - gpt-oss
      - --gpu-layers
      - '@GPT_GPU_LAYERS@'
      - --flash-attn
      - 'on'
      - -t
      - '@THREADS@'
      - --ctx-size
      - '@CTX_SIZE@'
      - --parallel
      - '1'
      - --cache-ram
      - '@PROMPT_CACHE_MIB@'

  litellm_gateway:
    id: runtime.litellm_gateway
    name: LiteLLM Gateway
    type: service
    working_dir: '@PROJECT_ROOT@'
    args:
      - --config
      - '@GATEWAY_CONFIG_ARGUMENT@'
      - --host
      - 127.0.0.1
      - --port
      - '4000'

  core_api:
    id: runtime.core_api
    name: Oratrice Core API
    type: service
    working_dir: '@PROJECT_ROOT@'
    args:
      - -m
      - uvicorn
      - oratrice_api.main:app
      - --host
      - 127.0.0.1
      - --port
      - '8000'

models:
  gemma_router:
    id: model.gemma_router
    name: Gemma 3n E4B Router
    runtime: runtime.gemma_router
    provider: provider.gemma_router
    path: '@ROUTER_MODEL@'
    enabled: true
    alias: gemma-router
    role: router

  gpt_oss:
    id: model.gpt_oss
    name: GPT-OSS 20B
    runtime: runtime.gpt_oss
    provider: provider.gpt_oss
    path: '@GPT_MODEL@'
    enabled: true
    alias: gpt-oss
    gateway_alias: gpt_oss

routes:
  default:
    id: route.default
    model: model.gpt_oss
    provider: provider.litellm_gateway
    policy: policy.local_only
    gateway_alias: gpt_oss

  gemma_router:
    id: route.gemma_router
    model: model.gemma_router
    provider: provider.gemma_router
    policy: policy.local_only

policies:
  local_only:
    id: policy.local_only
    name: Local-only inference
    require_local: true
    allow_cloud: false

defaults:
  profile: local
  host: 127.0.0.1
  launcher:
    attempt_limit: 3
    ui_url: http://127.0.0.1:8000/ui/
    ui_health_url: http://127.0.0.1:8000/live
    open_ui_if_available: true
    targets:
      - id: gpt_oss
        runtime: runtime.gpt_oss
        timeout: 180
        health_endpoint: http://127.0.0.1:8080/health
      - id: gemma_router
        runtime: runtime.gemma_router
        timeout: 180
        health_endpoint: http://127.0.0.1:8090/health
      - id: litellm_gateway
        runtime: runtime.litellm_gateway
        timeout: 120
        executable_override: '@GATEWAY_EXE@'
        health_endpoint: http://127.0.0.1:4000/health/liveliness
        required_env:
          - ORATRICE_LITELLM_MASTER_KEY
        generate_if_missing: true
        environment:
          LITELLM_LOG: WARNING
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      - id: core_api
        runtime: runtime.core_api
        timeout: 60
        executable_override: '@CORE_PYTHON@'
        health_endpoint: http://127.0.0.1:8000/live
  router:
    type: gemma
    model: model.gemma_router
    routing_model: model.gemma_router
    provider: provider.gemma_router
    routing_provider: provider.gemma_router
    endpoint: http://127.0.0.1:8090/v1
    allowed_models:
      - gpt_oss
    allowed_providers:
      - provider.litellm_gateway
    strategy:
      candidates:
        - id: gpt_oss
          model: gpt_oss
          provider: provider.litellm_gateway
          task_types:
            - general
            - chat
            - coding
            - reasoning
          complexities:
            - low
            - medium
            - high
          capabilities:
            - text
            - chat
            - coding
            - reasoning
          priority: 0
          requires_cloud_opt_in: false
  gateway:
    provider: provider.litellm_gateway
    alias: litellm
    base_url: http://127.0.0.1:4000/v1
    health_endpoint: http://127.0.0.1:4000/health/liveliness
    config_path: '@GATEWAY_CONFIG_PATH@'
    model_aliases:
      gpt_oss: gpt_oss
