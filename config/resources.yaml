# ==========================================================
# Project Oratrice Resource Registry
# Version: 0.2
# ==========================================================

resources:

  runtimes:

    llama_cpp:

      id: runtime.llama_cpp
      name: llama.cpp
      enabled: true

      type: executable

      executable: D:/AI/runtimes/llama.cpp/llama-server.exe
      working_dir: D:/AI/runtimes/llama.cpp

      args:
        - "--host"
        - "127.0.0.1"

        - "--port"
        - "8080"

        - "-ngl"
        - "999"

        - "--flash-attn"
        - "on"

        - "-t"
        - "16"


  models:

    gpt_oss:

      id: model.gpt_oss
      name: GPT-OSS 20B
      enabled: true

      runtime: runtime.llama_cpp
      path: ../../models/GPT-OSS/openai_gpt-oss-20b-MXFP4.gguf


    qwen2_5_vl:

      id: model.qwen2_5_vl
      name: Qwen2.5-VL-3B
      enabled: true

      runtime: runtime.llama_cpp
      path: ../../models/Qwen2.5-VL-3B


  services:

    open_webui:

      id: service.open_webui
      name: Open WebUI
      enabled: true

      type: docker
      container: open-webui


  apps:

    goose:

      id: app.goose
      name: Goose
      enabled: true

      path: apps/Goose


  system:

    python:

      id: system.python
      name: Python 3.13
      enabled: true

      path: ../.venv/Scripts/python.exe


    node:

      id: system.node
      name: Node.js
      enabled: true

      path: C:/Program Files/nodejs/node.exe


    git:

      id: system.git
      name: Git
      enabled: true

      path: C:/Program Files/Git/cmd/git.exe


    wsl:

      id: system.wsl
      name: Ubuntu WSL2
      enabled: true

      distro: Ubuntu
