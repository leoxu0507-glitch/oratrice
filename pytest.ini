[pytest]
# The ordinary suite is an offline contract suite.  Keep the explicit live
# harness outside normal discovery even when a contributor adds tests below
# tests/live/; invoke the harness itself (or a deliberately targeted test)
# when a real endpoint check is wanted.
testpaths = tests
norecursedirs = .git .venv venv __pycache__ live
markers =
    live: explicit endpoint/model verification; never collected by default
