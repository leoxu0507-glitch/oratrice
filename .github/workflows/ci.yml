name: Portable checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node for browser behavior tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          core entities providers router launcher oratrice_api scripts

      - name: Run the full offline suite
        run: python -m pytest -q -p no:cacheprovider

      - name: Run Web UI behavior tests
        run: node --test tests/web_chat.test.cjs

