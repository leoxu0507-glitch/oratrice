name: Portable checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          core entities providers router launcher oratrice_api scripts

      - name: Run portable offline contract tests
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_api_contract.py
          tests/test_api_lifecycle.py
          tests/test_facade_contract.py
          tests/test_import_boundaries.py
          tests/test_multimodal_contract.py
          tests/test_observability.py
          tests/test_provider.py
          tests/test_registry.py
          tests/test_router_contract.py
          tests/test_router_policy.py
          tests/test_runtime.py
          tests/test_m8_web_ui.py

